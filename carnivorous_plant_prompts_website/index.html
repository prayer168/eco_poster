const cardsEl = document.getElementById('cards');
const searchEl = document.getElementById('search');
const chipsEl = document.getElementById('chips');
const toast = document.getElementById('toast');
let currentCat = '全部';

const cats = ['全部', ...Array.from(new Set(prompts.map(p => p.cat)))];

function showToast(text='已複製提示詞') {
  toast.textContent = text;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 1350);
}

function renderChips() {
  chipsEl.innerHTML = cats.map(cat => `<button class="chip ${cat===currentCat?'active':''}" data-cat="${cat}">${cat}</button>`).join('');
  chipsEl.querySelectorAll('.chip').forEach(btn => {
    btn.addEventListener('click', () => {
      currentCat = btn.dataset.cat;
      renderChips();
      renderCards();
    });
  });
}

function renderCards() {
  const q = searchEl.value.trim().toLowerCase();
  const list = prompts.filter(p => {
    const matchCat = currentCat === '全部' || p.cat === currentCat;
    const hay = `${p.title} ${p.subtitle} ${p.desc} ${p.prompt} ${p.cat}`.toLowerCase();
    return matchCat && (!q || hay.includes(q));
  });
  cardsEl.innerHTML = list.map(p => {
    const safePrompt = p.prompt.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');
    return `
      <article class="card" data-no="${p.no}">
        <div class="card-head">
          <div class="badge">${String(p.no).padStart(2,'0')}</div>
          <div class="cat">${p.cat}</div>
          <h3>${p.title}</h3>
          <div class="small-sub">${p.subtitle}</div>
        </div>
        <div class="card-body">
          <div class="desc">${p.desc}</div>
          <textarea readonly>${safePrompt}</textarea>
          <div class="btns">
            <button class="action copy" data-no="${p.no}">📋 複製提示詞</button>
            <button class="action expand" data-no="${p.no}">🔎 展開 / 收合</button>
          </div>
        </div>
      </article>`;
  }).join('') || `<div class="panel" style="grid-column:1/-1"><h2>沒有找到符合的提示詞</h2><p>請換個關鍵字或切回「全部」。</p></div>`;

  cardsEl.querySelectorAll('textarea').forEach(t => {
    t.dataset.fullHeight = Math.max(190, t.scrollHeight + 8);
    t.style.height = '190px';
  });

  cardsEl.querySelectorAll('.copy').forEach(btn => {
    btn.addEventListener('click', async () => {
      const no = Number(btn.dataset.no);
      const p = prompts.find(x => x.no === no);
      try {
        await navigator.clipboard.writeText(p.prompt);
        showToast(`已複製第 ${String(no).padStart(2,'0')} 張提示詞`);
      } catch(e) {
        const ta = btn.closest('.card').querySelector('textarea');
        ta.select();
        document.execCommand('copy');
        showToast(`已複製第 ${String(no).padStart(2,'0')} 張提示詞`);
      }
    });
  });

  cardsEl.querySelectorAll('.expand').forEach(btn => {
    btn.addEventListener('click', () => {
      const ta = btn.closest('.card').querySelector('textarea');
      if (ta.style.height === '190px') {
        ta.style.height = ta.dataset.fullHeight + 'px';
      } else {
        ta.style.height = '190px';
      }
    });
  });
}

searchEl.addEventListener('input', renderCards);
renderChips();
renderCards();
</script>
